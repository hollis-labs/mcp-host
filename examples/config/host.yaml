# Example mcp-host config. See README.md for the full field reference.
#
# Two logical servers: a process-mode echo server exposed over stdio, and
# an inprocess-mode clock plugin exposed over HTTP.
logical_servers:
  - id: echo
    name: Echo Server
    description: Standalone process-mode MCP server, spawned and supervised.
    transport: process
    process:
      command: ./bin/echo-server
      args: []
    serve:
      stdio: true

  - id: clock
    name: Clock Plugin
    description: Lightweight inprocess-mode plugin speaking plugin-sdk's dialect.
    transport: inprocess
    inprocess:
      command: ./bin/clock-plugin
      # Tool catalog is declared here, not discovered from the running
      # plugin — see transport/inprocess's package doc for why.
      tools:
        - name: now
          description: Returns the current UTC time in RFC 3339 format.
          input_schema:
            type: object
            properties: {}
            additionalProperties: false
          annotations:
            readOnlyHint: true
            destructiveHint: false
            idempotentHint: false
            openWorldHint: false
    serve:
      http:
        path: /clock
        allowed_origins: []
        bearer_tokens: []
