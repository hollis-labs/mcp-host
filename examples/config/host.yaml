# Example Station config. See README.md for the full field reference.
#
# Two logical servers: a process-mode echo server exposed over stdio, and
# an inprocess-mode clock plugin exposed over HTTP.
logical_servers:
  - id: echo
    name: Echo Server
    description: Standalone process-mode MCP server, spawned and supervised.
    transport: process
    process:
      command: ./bin/echo-server
      args: []
    serve:
      stdio: true

  - id: clock
    name: Clock Plugin
    description: Lightweight inprocess-mode plugin speaking plugin-sdk's dialect.
    transport: inprocess
    inprocess:
      command: ./bin/clock-plugin
    serve:
      http:
        path: /clock
        allowed_origins: []
        bearer_tokens: []
